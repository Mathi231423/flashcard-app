<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Weicher Bodenschatten -->
    <ellipse id="shadow" cx="240" cy="590" rx="210" ry="25" fill="#bfaeb9" />
  </defs>

  <use href="#shadow" />

  <!-- Herz über dem Kopf -->
  <g>
    <path d="M 230 75 
             C 210 40, 160 35, 140 70 
             C 120 35, 70 40, 50 75 
             C 30 115, 60 150, 140 185 
             C 220 150, 250 115, 230 75 Z" fill="#ff5c8a" stroke="#4a1530" stroke-width="9" stroke-linejoin="round" />
    <!-- Glanzlicht Herz -->
    <ellipse cx="95" cy="80" rx="14" ry="9" fill="#ffffff" opacity="0.65" transform="rotate(-35 95 80)" />
  </g>

  <!-- Capybara Körper -->
  <!-- 1. Hauptumriss -->
  <path d="M 125 185 
           C 165 180, 245 180, 290 220 
           C 335 260, 395 360, 435 440 
           C 475 520, 445 575, 415 575 
           L 100 575 
           C 70 575, 50 540, 55 490 
           C 65 390, 85 270, 75 225 
           C 70 195, 95 188, 125 185 Z" fill="#fba364" stroke="#4a1530" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />

  <!-- 2. Hinteres Ohr -->
  <path d="M 265 170 C 275 145, 305 150, 312 170 C 318 185, 300 200, 290 195 Z" fill="#ce7a46" stroke="#4a1530" stroke-width="9" stroke-linejoin="round" />

  <!-- 3. Vorderes Ohr -->
  <path d="M 315 210 C 330 180, 365 175, 375 200 C 382 220, 360 245, 340 238 Z" fill="#ce7a46" stroke="#4a1530" stroke-width="10" stroke-linejoin="round" />

  <!-- 4. Dunkler Bereich Schnauze -->
  <path d="M 75 225 
           C 95 190, 150 182, 185 210 
           C 215 235, 195 295, 160 305 
           C 130 315, 95 295, 80 255 Z" fill="#ce7a46" />

  <!-- 5. Wangenfleck rechts -->
  <ellipse cx="280" cy="275" rx="42" ry="26" fill="#ce7a46" transform="rotate(8 280 275)" />
  <ellipse cx="295" cy="265" rx="8" ry="5" fill="#ffffff" opacity="0.45" transform="rotate(-10 295 265)" />

  <!-- 6. Augen & Gesichtszüge -->
  <!-- Nase -->
  <line x1="82" y1="225" x2="90" y2="238" stroke="#4a1530" stroke-width="9" stroke-linecap="round" />
  <!-- Auge links -->
  <path d="M 135 240 Q 155 230, 172 236" fill="none" stroke="#4a1530" stroke-width="10" stroke-linecap="round" />
  <!-- Auge rechts -->
  <path d="M 245 235 Q 265 230, 282 238" fill="none" stroke="#4a1530" stroke-width="10" stroke-linecap="round" />

  <!-- 7. Salatblatt im Mund -->
  <g>
    <!-- Blätter -->
    <path d="M 105 310 
             C 80 295, 55 330, 72 355 
             C 85 375, 110 365, 120 350 
             C 125 368, 148 360, 145 340 
             C 158 335, 150 310, 135 310 Z" fill="#a4df6c" stroke="#4a1530" stroke-width="9" stroke-linejoin="round" />
    <path d="M 72 340 C 50 348, 60 370, 78 360 Z" fill="#a4df6c" stroke="#4a1530" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- 8. Hamsterbacke / Kauende Lippe über dem Blatt -->
  <path d="M 108 270 
           L 108 300 
           C 108 322, 138 325, 148 310 
           C 162 290, 175 285, 168 325" fill="none" stroke="#4a1530" stroke-width="10" stroke-linecap="round" />
  <!-- Kinnfalte -->
  <path d="M 135 340 C 145 345, 158 350, 160 358" fill="none" stroke="#4a1530" stroke-width="9" stroke-linecap="round" />

  <!-- 9. Vorderbeine & Pfoten -->
  <!-- Pfotenkontur links -->
  <path d="M 120 440 L 132 530 C 132 555, 145 555, 155 555 L 180 555 C 195 555, 198 540, 198 520 L 198 440" fill="none" stroke="#4a1530" stroke-width="10" stroke-linecap="round" />
  <!-- Pfotenkontur rechts -->
  <path d="M 218 440 L 218 520 C 218 540, 225 555, 238 555 L 265 555 C 278 555, 290 535, 305 440" fill="none" stroke="#4a1530" stroke-width="10" stroke-linecap="round" />

  <!-- Dunkle Pfotenenden -->
  <path d="M 132 525 C 132 560, 140 575, 165 575 C 190 575, 198 560, 198 525 Z" fill="#ce7a46" stroke="#4a1530" stroke-width="9" stroke-linejoin="round" />
  <path d="M 218 525 C 218 560, 226 575, 250 575 C 275 575, 285 560, 285 525 Z" fill="#ce7a46" stroke="#4a1530" stroke-width="9" stroke-linejoin="round" />

  <!-- 10. Hinterbeine / Sitzfalten -->
  <!-- Linker Fuß -->
  <path d="M 80 500 C 45 500, 45 560, 70 568 C 88 574, 98 570, 110 568" fill="#fba364" stroke="#4a1530" stroke-width="10" stroke-linejoin="round" />
  <!-- Rechte Gesäß-/Beinfalte -->
  <path d="M 375 480 C 335 495, 325 540, 330 570 C 332 575, 342 576, 355 575" fill="none" stroke="#4a1530" stroke-width="10" stroke-linecap="round" />

  <!-- 11. Fellstriche Flanke -->
  <line x1="380" y1="415" x2="390" y2="440" stroke="#4a1530" stroke-width="9" stroke-linecap="round" />
  <line x1="400" y1="432" x2="410" y2="455" stroke="#4a1530" stroke-width="9" stroke-linecap="round" />
  <line x1="392" y1="458" x2="400" y2="480" stroke="#4a1530" stroke-width="9" stroke-linecap="round" />
</svg>